<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Weather App</title>
        <meta charset="UTF-8">
    <script defer src="main.js"></script></head>
    <body>
        <div class="header-main">
            <div class="header">
                <div class="header-content">Weather App</div>
                <div class="header-tagline">For all the skies ahead</div>
            </div>
        </div>
        <div class="main">
            <div class="search">
                <form id="form">
                    <label for="city">Search for Your city</label>
                    <input type="text" class="city" placeholder="London">
                </form>
            </div>
            <div class="weathermain">
                <div class="weathermain-one">
                    <div class="cityname"></div>
                    <div class="coordinates">
                        <div class="latitude"></div>
                        <div class="longitude"></div>
                    </div>
                </div>
                <div class="weathermain-two">
                    <div class="currenttemp"></div>
                    <div class="feelslike"></div>
                    <div class="currentcondition"></div>
                    <div class="description"></div>
                    <div class="humidity"></div>
                </div>
            </div>
        </div>
    </body>
</html>
